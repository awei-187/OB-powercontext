services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    ports:
      - "127.0.0.1:${SEEKDB_PORT:-2881}:2881"
    environment:
      ROOT_PASSWORD: "${SEEKDB_ROOT_PASSWORD:?Set a local administrator password}"
      SEEKDB_DATABASE: "${SEEKDB_DATABASE:-minimax_sdd}"
      MEMORY_LIMIT: 2G
      CPU_COUNT: "2"
      DATAFILE_SIZE: 2G
      DATAFILE_NEXT: 1G
      DATAFILE_MAXSIZE: 10G
      LOG_DISK_SIZE: 2G
    volumes:
      - seekdb-data:/var/lib/seekdb
    mem_limit: 3g
    cpus: 2
    stop_grace_period: 90s
    restart: unless-stopped
volumes:
  seekdb-data:
