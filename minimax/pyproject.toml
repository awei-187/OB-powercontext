[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-sdd-context"
version = "0.1.0"
description = "Reproducible SDD context module for the MiniMax competition"
requires-python = ">=3.12"
dependencies = [
    "PyMySQL==1.1.2",
    "powercontext[builtin] @ git+https://github.com/oceanbase/powercontext.git@9db1753434162c0aa7c9f1189a1722e617880a52",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sample_project*", "sdd_context*"]
